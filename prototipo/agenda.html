<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://nutriplat.com.br/agenda" />
<noscript><meta http-equiv="refresh" content="0; url=https://nutriplat.com.br/agenda" /></noscript>
<title>Mudamos de endereco</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#840B55; color:#fff; text-align:center; padding:24px;
         font-family:Montserrat,system-ui,sans-serif; }
  p { max-width:30rem; line-height:1.6; }
  a { color:#fff; }
</style>
</head>
<body>
  <div>
    <p><strong>O acompanhamento mudou de endereco.</strong></p>
    <p>Estamos te levando para <a href="https://nutriplat.com.br/agenda">https://nutriplat.com.br/agenda</a>.
       Se voce tinha o atalho na tela inicial, instale de novo por la.</p>
  </div>
  <script>
    // Limpa o PWA antigo antes de sair, senao o atalho na tela inicial
    // continua abrindo a versao em cache.
    (function () {
      // O `?code=` / `#access_token=` dos e-mails de recuperacao vem grudado na
      // URL. Sem carregar isso adiante, quem clicou num link antigo perde o
      // token no caminho e cai na tela de login sem conseguir trocar a senha.
      var ir = function () {
        location.replace("https://nutriplat.com.br/agenda" + location.search + location.hash);
      };
      if (!("serviceWorker" in navigator)) return ir(), undefined;
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .then(function () { return caches.keys(); })
        .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
        .catch(function () {})
        .then(ir);
    })();
  </script>
</body>
</html>
