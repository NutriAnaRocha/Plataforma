<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title data-brand-title>Prontuário</title>
  <!--
    A tela /prontuario foi absorvida pela ficha do paciente (pacientes.html?id=…).
    Ela lia a coluna `pacientes.prontuario`, que o fluxo atual não escreve mais —
    todo paciente real abria com as 15 abas vazias, enquanto a ficha tinha os dados.
    Este arquivo só reencaminha; a versão antiga está em ../_legado/.
  -->
  <script>
  (function () {
    // Módulo da tela antiga → seção equivalente na ficha.
    var MAPA = {
      anamnese: "anamnese", diario: "prato", quest: "anamnese", exames: "exames",
      antro: "antropometria", calc: "calculos", plano: "plano", metas: "metas",
      orient: "orientacoes", manip: "prescricoes", anexos: "arquivos",
      evolucao: "prontuario", chat: "comunicacao", docs: "arquivos", fin: "financeiro"
    };
    var id  = new URLSearchParams(location.search).get("id");
    var mod = (location.hash || "").replace(/^#/, "");
    var url = "pacientes.html";
    if (id) {
      url += "?id=" + encodeURIComponent(id);
      if (MAPA[mod]) url += "&sec=" + MAPA[mod];
    }
    location.replace(url);
  })();
  </script>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:24px">
    O prontuário agora fica dentro da ficha do paciente.
    <a href="pacientes.html">Ir para Pacientes</a>
  </p>
</body>
</html>
