<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-brand-title>Meu acompanhamento</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/tokens.css?v=ad4420de" />
  <link rel="stylesheet" href="assets/css/style.css?v=d7d917c5" />
  <link rel="stylesheet" href="assets/css/portal.css?v=ccfedd4b" />
  <link rel="stylesheet" href="assets/css/antropometria.css?v=28f9bdaa" />
  <link rel="stylesheet" href="assets/css/lista-compras.css?v=5bf0256a" />
  <link rel="stylesheet" href="assets/css/treino.css?v=d0de9f43" />
  <link rel="stylesheet" href="assets/css/metas.css?v=4c924dc6" />
  <link rel="stylesheet" href="assets/css/receitas-paciente.css?v=d6182c03" />
  <link rel="stylesheet" href="assets/css/anamnese.css?v=efc5dada" />
  <link rel="stylesheet" href="assets/css/intestino.css?v=6c2187ac" />
  <link rel="stylesheet" href="assets/css/ciclo.css?v=953d8ea0" />
  <link rel="stylesheet" href="assets/css/paciente-arquivos.css?v=190f96d1" />
</head>
<body class="portal-body">

  <!-- Faixa de pré-visualização (só no modo "Ver como paciente" da nutri) -->
  <div class="preview-bar" id="preview-bar" hidden>
    👁 Você está vendo o portal <strong>como o paciente veria</strong>.
    <a href="pacientes.html" class="preview-bar__back">‹ Voltar ao painel</a>
  </div>

  <div class="portal" id="portal" hidden>

    <!-- Cabeçalho -->
    <header class="portal-head">
      <div class="portal-head__brand">
        <span class="portal-head__mark"><img src="assets/img/logo-mark.png" alt="" /></span>
        <span data-brand>NutriPlat</span>
      </div>
      <div class="portal-head__right">
        <span class="portal-head__hi" id="portal-hi">Olá</span>
        <button class="icon-btn" id="portal-logout" type="button" title="Sair" aria-label="Sair" data-logout>↩</button>
      </div>
    </header>

    <!-- Cartão de boas-vindas -->
    <section class="portal-hero">
      <span class="portal-hero__avatar" id="portal-avatar">?</span>
      <div>
        <h1 class="portal-hero__name" id="portal-name">—</h1>
        <p class="portal-hero__sub" id="portal-sub">Acompanhe seu plano, sua evolução e fale com sua nutricionista.</p>
      </div>
    </section>

    <!-- Avaliação da última consulta (só aparece quando há uma pendente) -->
    <div id="av-host"></div>

    <!-- Abas -->
    <nav class="portal-tabs" id="portal-tabs" aria-label="Seções">
      <button class="ptab" data-t="anamnese" type="button">📝 Anamnese</button>
      <button class="ptab" data-t="reavaliacao" type="button">🔄 Reavaliação</button>
      <button class="ptab is-active" data-t="plano" type="button">🥗 Meu plano</button>
      <button class="ptab" data-t="prato" type="button">📷 Meu prato</button>
      <button class="ptab" data-t="receitas" type="button">🍳 Receitas</button>
      <button class="ptab" data-t="treino" type="button">🏋️ Treino</button>
      <button class="ptab" data-t="metas" type="button">🎯 Metas</button>
      <button class="ptab" data-t="intestino" type="button">🌿 Meu intestino</button>
      <button class="ptab" data-t="ciclo" type="button">🌸 Meu ciclo</button>
      <button class="ptab" data-t="evolucao" type="button">📈 Evolução</button>
      <button class="ptab" data-t="formulas" type="button">💊 Fórmulas</button>
      <button class="ptab" data-t="exames" type="button">🧪 Exames</button>
      <button class="ptab" data-t="documentos" type="button">📎 Documentos</button>
      <button class="ptab" data-t="consultas" type="button">📅 Consultas</button>
      <button class="ptab" data-t="chat" type="button">💬 Mensagens</button>
    </nav>

    <main class="portal-main" id="portal-main">
      <div class="portal-pane" data-pane="anamnese" id="pane-anamnese"></div>
      <div class="portal-pane" data-pane="reavaliacao" id="pane-reavaliacao"></div>
      <div class="portal-pane is-active" data-pane="plano" id="pane-plano"></div>
      <div class="portal-pane" data-pane="prato" id="pane-prato"></div>
      <div class="portal-pane" data-pane="receitas" id="pane-receitas"></div>
      <div class="portal-pane" data-pane="treino" id="pane-treino"></div>
      <div class="portal-pane" data-pane="metas" id="pane-metas"></div>
      <div class="portal-pane" data-pane="intestino" id="pane-intestino"></div>
      <div class="portal-pane" data-pane="ciclo" id="pane-ciclo"></div>
      <div class="portal-pane" data-pane="evolucao" id="pane-evolucao"></div>
      <div class="portal-pane" data-pane="formulas" id="pane-formulas"></div>
      <div class="portal-pane" data-pane="exames" id="pane-exames"></div>
      <div class="portal-pane" data-pane="documentos" id="pane-documentos"></div>
      <div class="portal-pane" data-pane="consultas" id="pane-consultas"></div>
      <div class="portal-pane" data-pane="chat" id="pane-chat"></div>
    </main>
  </div>

  <div class="portal-loading" id="portal-loading">Carregando seu acompanhamento…</div>

  <!-- Scripts -->
  <script src="assets/js/pwa.js?v=89ea9fd0"></script>
  <script src="assets/js/icones.js?v=584c5273"></script>
  <script src="assets/js/supabase-client.js?v=6b9d6888"></script>
  <script src="assets/js/pacientes-db.js?v=46268ced"></script>
  <script src="assets/js/alimentos-data.js?v=a76f73d5"></script>
  <script src="assets/js/nome-alimento.js?v=422dea4a"></script>
  <script src="assets/js/lista-compras.js?v=8c034ce8"></script>
  <script src="assets/js/anamnese-paciente.js?v=365f649b"></script>
  <script src="assets/js/reavaliacao-paciente.js?v=8344652b"></script>
  <script src="assets/js/prato-paciente.js?v=f7ef9cac"></script>
  <script src="assets/js/receitas-paciente.js?v=8d9b5342"></script>
  <!-- Treino e Metas expõem TreinoView/MetasView, que portal.js chama para
       montar as abas 🏋️ e 🎯. Sem estes dois, as abas nascem vazias. -->
  <script src="assets/js/treino-paciente.js?v=d793329a"></script>
  <script src="assets/js/metas-paciente.js?v=2d2ae597"></script>
  <!-- Espaços de auto-registro do paciente (0067/0068). Expõem
       IntestinoView/CicloView, que portal.js monta nas abas 🌿 e 🌸. -->
  <script src="assets/js/intestino.js?v=6461caa3"></script>
  <script src="assets/js/ciclo.js?v=5fecf2c4"></script>
  <!-- Documentos que a nutri liberou nesta ficha (0070). Expõe
       ArquivosView, que portal.js monta na aba 📎. -->
  <!-- Formulas e exames do paciente: le a propria ficha (RLS). A regua dos
       marcadores vem de paciente-exames.js (window.Exames.MARC). -->
  <script src="assets/js/editor-formulas.js?v=a9bcffd6"></script>
  <script src="assets/js/paciente-exames.js?v=08ea59fd"></script>
  <script src="assets/js/portal-clinico.js?v=7944349c"></script>
  <script src="assets/js/arquivos-db.js?v=d3356b10"></script>
  <script src="assets/js/arquivos-paciente.js?v=003e5753"></script>
  <!-- AvaliacaoView: o cartão "como foi a sua consulta" (#av-host), montado
       por portal.js no fim do boot. -->
  <script src="assets/js/avaliacao-paciente.js?v=1275e44f"></script>
  <script src="assets/js/avaliacoes-db.js?v=9559f494"></script>
  <script src="assets/js/antropometria.js?v=8074b4c9"></script>
  <script src="assets/js/portal.js?v=5ede0af5"></script>
  <script src="assets/js/confirmar-exclusao.js?v=2cf5dcf5"></script>
  <script src="assets/js/app.js?v=cb7d93e5"></script>
</body>
</html>
